name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,edge]"
      - name: Tiny ONNX
        run: python edge/scripts/make_tiny_onnx.py
      - name: Ruff
        run: ruff check edge shared/python
      - name: Pytest
        run: pytest -q
      - name: Edge smoke
        run: python -m rasaops_edge.scripts.smoke_capture --frames 2
      - name: Pipeline smoke
        run: python -m rasaops_edge.scripts.run_pipeline_smoke --frames 12
      - name: Inference bench
        run: python edge/scripts/bench_edge_inference.py --backend mock --iters 10
