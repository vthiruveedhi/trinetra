<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="100%" role="img">
  <title>trinetra edge architecture — Pi 5 + Hailo-8L (~$175/site, May 2026)</title>
  <desc>Per-site Pi 5 8GB with Hailo AI HAT+ 13 TOPS (Hailo-8L) runs Frigate 0.17, YOLO26-n on the Hailo NPU, ByteTrack on CPU, and OSNet re-ID on Hailo. A cascaded motion-then-detect pipeline lets one node handle 3 cameras. Only ~1 KB/s of events crosses the internet to a near-zero-cost cloud (Cloudflare Workers, Neon Postgres free tier, Grafana Cloud). VLM Q&amp;A bursts to RunPod Serverless (Qwen3-VL 30B-A3B).</desc>

  <style>
    .title { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
    .region-title { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .box-title { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .box-text { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
    .arrow-label { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .accent { fill: #059669; font-weight: 600; }
    .site-container { fill: #ecfdf5; stroke: #10b981; }
    .site-box { fill: #d1fae5; stroke: #059669; }
    .cloud-container { fill: #eff6ff; stroke: #3b82f6; }
    .cloud-box { fill: #dbeafe; stroke: #2563eb; }
    .burst-box { fill: #f3e8ff; stroke: #a855f7; }
    .arr { stroke: #475569; stroke-width: 1.5; fill: none; }
    .arr-dashed { stroke: #a855f7; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="title" x="340" y="30" text-anchor="middle">Edge architecture — Pi 5 + Hailo-8L (~$175/site)</text>
  <text class="subtitle" x="340" y="50" text-anchor="middle">May 2026 · Frigate 0.17 + YOLO26-n + cascaded pipeline · only events cross the internet</text>

  <rect class="site-container" x="40" y="70" width="600" height="260" rx="20" stroke-width="0.5"/>
  <text class="region-title" x="60" y="94">At each restaurant</text>
  <text class="subtitle" x="60" y="110">Everything below stays on the local network</text>

  <rect class="site-box" x="60" y="130" width="140" height="180" rx="12" stroke-width="0.5"/>
  <text class="box-title" x="130" y="152" text-anchor="middle">IP cameras</text>
  <text class="box-text" x="130" y="172" text-anchor="middle">RTSP H.264</text>
  <text class="box-text" x="130" y="190" text-anchor="middle">1–3 per site</text>
  <text class="box-text" x="130" y="208" text-anchor="middle">1080p @ 15–30 FPS</text>
  <text class="box-text" x="130" y="230" text-anchor="middle">BYO / any cheap</text>
  <text class="box-text" x="130" y="248" text-anchor="middle">POE camera works</text>

  <rect class="site-box" x="220" y="130" width="400" height="180" rx="12" stroke-width="0.5"/>
  <text class="box-title" x="420" y="152" text-anchor="middle">Pi 5 8GB + Hailo AI HAT+ 13 TOPS (Hailo-8L)</text>
  <text class="box-text" x="240" y="174">• Frigate 0.17 — RTSP ingest, zones, line crossings</text>
  <text class="box-text" x="240" y="192">• MOG2 motion detector (CPU) — cascaded gate</text>
  <text class="box-text" x="240" y="210">• YOLO26-n .hef on Hailo — runs only on motion frames</text>
  <text class="box-text" x="240" y="228">• ByteTrack (CPU) + OSNet re-ID .hef on Hailo</text>
  <text class="box-text" x="240" y="246">• SQLite buffer + event batcher — offline-safe</text>
  <text class="box-text accent" x="240" y="270">≈ $175 kitted (Pi + HAT+ + PSU + case + SD)</text>
  <text class="box-text accent" x="240" y="288">Cascaded pipeline → 3 cams on one Hailo-8L</text>

  <line x1="200" y1="220" x2="220" y2="220" class="arr" marker-end="url(#arrow)"/>

  <line x1="420" y1="330" x2="420" y2="390" class="arr" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="430" y="350">HTTPS events + keyframes</text>
  <text class="arrow-label" x="430" y="366">≈ 1 KB/s per camera</text>

  <rect class="cloud-container" x="40" y="390" width="600" height="220" rx="20" stroke-width="0.5"/>
  <text class="region-title" x="60" y="414">Central cloud — near-zero-cost, all serverless</text>
  <text class="subtitle" x="60" y="430">~$5–25/mo total for 10 sites at moderate load</text>

  <rect class="cloud-box" x="60" y="450" width="130" height="140" rx="12" stroke-width="0.5"/>
  <text class="box-title" x="125" y="472" text-anchor="middle">Event API</text>
  <text class="box-text" x="125" y="492" text-anchor="middle">Cloudflare</text>
  <text class="box-text" x="125" y="510" text-anchor="middle">Workers (free)</text>

  <rect class="cloud-box" x="205" y="450" width="130" height="140" rx="12" stroke-width="0.5"/>
  <text class="box-title" x="270" y="472" text-anchor="middle">Postgres</text>
  <text class="box-text" x="270" y="492" text-anchor="middle">Neon serverless</text>
  <text class="box-text" x="270" y="510" text-anchor="middle">+ pgvector</text>

  <rect class="cloud-box" x="350" y="450" width="130" height="140" rx="12" stroke-width="0.5"/>
  <text class="box-title" x="415" y="472" text-anchor="middle">Keyframes</text>
  <text class="box-text" x="415" y="492" text-anchor="middle">Cloudflare R2</text>
  <text class="box-text" x="415" y="510" text-anchor="middle">$0.015/GB</text>

  <rect class="cloud-box" x="495" y="450" width="130" height="140" rx="12" stroke-width="0.5"/>
  <text class="box-title" x="560" y="472" text-anchor="middle">Dashboard</text>
  <text class="box-text" x="560" y="492" text-anchor="middle">Grafana Cloud</text>
  <text class="box-text" x="560" y="510" text-anchor="middle">(free tier)</text>

  <line x1="190" y1="520" x2="205" y2="520" class="arr" marker-end="url(#arrow)"/>
  <line x1="335" y1="520" x2="350" y2="520" class="arr" marker-end="url(#arrow)"/>
  <line x1="480" y1="520" x2="495" y2="520" class="arr" marker-end="url(#arrow)"/>

  <line x1="270" y1="590" x2="270" y2="640" class="arr-dashed" marker-end="url(#arrow-purple)"/>
  <text class="arrow-label" x="280" y="618" fill="#a855f7">On-demand only</text>

  <rect class="burst-box" x="40" y="640" width="600" height="110" rx="16" stroke-width="0.5"/>
  <text class="region-title" x="60" y="662">Burst VLM (pay-per-query)</text>
  <text class="subtitle" x="60" y="678">Only spins up when someone asks a natural-language question</text>
  <text class="box-title" x="60" y="704">RunPod Serverless — Qwen3-VL 30B-A3B</text>
  <text class="box-text" x="60" y="722">MoE activates 3B params · per-millisecond billing · sub-200 ms cold-start via FlashBoot</text>
  <text class="box-text accent" x="60" y="740">≈ ₹5–10 per query · ~$1–2/mo at moderate use</text>

  <text class="arrow-label" x="500" y="704" text-anchor="end">India alt: GCP asia-south1 g2 preempt.</text>
  <text class="arrow-label" x="500" y="722" text-anchor="end">~$0.28/hr L4, per-second billing</text>
  <text class="arrow-label" x="500" y="740" text-anchor="end">Use when data must stay in-region</text>
</svg>
