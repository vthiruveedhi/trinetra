# Demo config sized for samples/people-detection.mp4 (768x432, Intel sample).
# Zones split the frame into left/right halves with a vertical line down the middle.
model: yolo11n.pt
confidence: 0.4
classes: [0]

zones:
  - name: left_zone
    polygon:
      - [0, 100]
      - [350, 100]
      - [350, 400]
      - [0, 400]
  - name: right_zone
    polygon:
      - [400, 100]
      - [768, 100]
      - [768, 400]
      - [400, 400]

lines:
  - name: midline
    from: [380, 0]
    to:   [380, 432]
